[tool.poetry]
name = "keep-automation-api"
version = "0.1.0"
description = "Keep Automations control-plane API — dedicated service (spec §10.2). D12: FastAPI skeleton with the three exposure tiers (user / machine / internal)."
authors = ["Keep"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = "^0.115.6"
uvicorn = "^0.34.0"
gunicorn = "^23.0.0"
python-dotenv = "^0.21.1"
pydantic = "^1.10.4"
sqlmodel = "^0.0.22"
sqlalchemy = "^2.0.14"
# No alembic: the automation tables' migration lineage lives in
# keep-api-gateway's Alembic (spec §4.4 — one `keep` database, one lineage).
psycopg2-binary = "^2.9.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.28.1"
pytest-asyncio = "^0.24.0"
pytest-docker = "^3.1.1"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
